name: 보유 종목 점검

on:
  push:
    branches: [main]
    paths: [pipeline.py, test_pipeline.py, notify.py, test_notify.py, .github/workflows/daily.yml]
  schedule:
    # 월~금 16:40 KST (07:40 UTC): KRX 마감 후. 미국은 전날 종가.
    - cron: "40 7 * * 1-5"
    # 매일 10:40 KST: 미국 종가 및 방금 완결된 가상자산 UTC 일봉 수집.
    - cron: "40 1 * * *"
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

# 국내 휴장일에는 새 봉이 없어 '새 봉 없음'으로 표시된다. GitHub 예약 실행은 수십 분 지연되거나 건너뛸 수 있다.

permissions:
  contents: write            # state/state.enc 커밋용
  pages: write               # Pages 배포
  id-token: write            # Pages 배포(OIDC)

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Re-runs must load the latest encrypted state, not an old snapshot.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: pip install --quiet cryptography

      - name: 자체 검증 (가짜 네트워크, 실패하면 여기서 멈춤)
        id: verify
        run: python3 -m unittest test_pipeline test_notify

      - name: 수집·계산·리포트
        id: collect
        env:
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}      # 보유내역 (비밀)
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}  # 없거나 8자 미만이면 아무것도 만들지 않고 중단
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}    # 선택. 공공데이터포털 키
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }} # 미국 시세용
          USDKRW: ${{ vars.USDKRW }}                       # 선택. 비우면 보유내역의 usdkrw 또는 1380
        run: python3 pipeline.py
        # 전 종목 실패 → 종료 코드 1 → 아래 단계 실행 안 됨 → 이전 페이지·이전 상태 유지

      - name: 비교용 상태 저장 (암호화된 state/state.enc 만 커밋. 리포트는 커밋하지 않음)
        run: |
          git config user.name "portfolio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.enc
          if git diff --cached --quiet; then echo "상태 변경 없음"; exit 0; fi
          git commit -m "state $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --quiet
          git push

      # GITHUB_TOKEN 으로 푸시한 커밋은 Pages 빌드를 시작하지 않는다.
      # 그래서 커밋에 기대지 않고 Pages 배포 작업을 직접 실행한다. (Settings → Pages → Source: GitHub Actions)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4


      - name: 텔레그램 알림 (미설정 시 건너뜀)
        id: notify
        if: ${{ always() && steps.verify.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        continue-on-error: true
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py

      - name: 암호화된 알림 상태 저장
        if: ${{ always() && (steps.notify.outcome == 'success' || steps.notify.outcome == 'failure') }}
        run: |
          if [ ! -f state/alerts.enc ]; then exit 0; fi
          git config user.name "portfolio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/alerts.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update encrypted notification state"
          git pull --rebase --quiet
          git push

      - name: 알림 실패 안내
        if: ${{ always() && steps.notify.outcome == 'failure' }}
        run: echo "::warning::Telegram notification failed. Check bot secrets and chat access. Report deployment is unaffected."

